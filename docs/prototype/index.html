const mealC=m=>m.map(x=>`<div class="row"><span><b>${x.t}</b><br><span class="mut">${x.i.map(i=>i[0]+' '+i[1]+'g').join(' · ')}</span></span><span class="mut">${x.k} kcal</span></div>`).join('');

const today=()=>P.some(p=>p.d.startsWith('오늘'))||S.wdone,sn=()=>6+(today()?1:0),badges=()=>[['첫 식단',P.length>0,''],['7일 연속',sn()>=7,'연속 7일을 기록하면 받아요'],['첫 PT 일지 확인',S.role=='member'||S.seen,'PT 일지를 처음 열어 보면 받아요'],['한 달 운동 20회',false,'이번 달 '+(14+(S.wdone?1:0))+' / 20회']];
const V={};
V.S01=()=>`<div style="padding-top:28px"><h1 style="font-size:28px">내 몸에 맞춘 식단과 운동, AI가 짜드려요</h1><p class="mut">몸 정보로 하루 소비 칼로리(TDEE)를 계산하고, 일주일 또는 한 달치 식단과 운동 루틴을 만들어요.</p></div><div class="card" style="margin-top:18px"><p>식단과 루틴을 한 번에 생성</p><p>올린 식단에 AI가 답변</p><p style="margin:0">PT 회원님은 운동일지까지</p></div><button class="btn" data-a="go" data-v="S02">내 칼로리 계산하기</button><button class="btn s" data-a="go" data-v="S05">로그인</button>`;
V.S02=()=>`${hd('몸 정보')}<p class="mut">성별</p>${seg('sex',['남','여'])}<div class="g3">${inp('키 (cm)','h','175')}${inp('나이','age','30')}${inp('몸무게 (kg)','w','72')}</div>${opt('근육량 (kg, 선택)','mm','mmU','32')}${opt('체지방량 (kg, 선택)','bf','bfU','14')}<p class="mut">체지방량을 알면 더 정확한 공식으로 계산해요. 모르면 '잘 모르겠음'을 눌러 주세요.</p><p class="mut">목표</p>${seg('goal',['감량','유지','증량'])}<button class="btn" data-a="go" data-v="S03">다음</button>`;
V.S03=()=>`${hd('운동 강도와 조건')}<p><b>지금 하고 있는 강도</b><br><span class="mut">칼로리 계산에 쓰여요</span></p>${seg('cur',['하','중','상'])}<p><b>앞으로 원하는 강도</b><br><span class="mut">운동 루틴의 세기에 쓰여요</span></p>${seg('des',['하','중','상'])}<div class="card mut">하: 주 1~3회 가볍게 · 중: 주 3~5회 · 상: 주 6회 이상 또는 고강도</div><p><b>운동 장소</b></p>${seg('place',['헬스장','집','둘 다'])}${S.place!='헬스장'?`<p><b>집에 있는 장비</b></p>${seg('equip',['맨몸','밴드·덤벨'])}<p><b>층간소음이 걱정돼요</b><br><span class="mut">예를 고르면 점프 동작을 빼요</span></p>${seg('noise',['예','아니오'])}`:''}<p><b>한 번에 운동할 시간</b></p>${seg('mins',['15분','30분','45분'])}<button class="btn" data-a="go" data-v="S04">결과 보기</button>`;
V.S04=()=>{const c=calc(),g=S.role=='guest';return `${hd('내 칼로리')}<div class="card"><p class="mut">하루 소비 칼로리 (TDEE)</p><p class="big">${F(c.t)} kcal</p><p class="mut" style="margin:0">기초대사량 ${F(c.b)} + 활동량(${S.cur}) 반영<br>${c.bf?'체지방량을 반영한 공식으로 계산했어요':'표준 공식으로 계산했어요 (체지방량을 입력하면 더 정확해져요)'}${c.mm?'<br>근육량은 AI가 식단·루틴을 짤 때 참고해요':''}</p></div><div class="card"><p class="mut">${S.goal} 목표 칼로리</p><p class="big">${F(c.k)} kcal</p>${c.cl?`<p class="warn" style="margin:0">너무 낮은 칼로리는 위험해서 최소 ${F(c.fl)}kcal로 맞췄어요.</p>`:''}</div><p class="mut">의료 조언이 아닙니다. 건강 상태에 따라 전문가와 상의하세요.</p><button class="btn" data-a="${g?'needLogin':'go'}" data-v="S06">식단·루틴 만들기</button>${g?'<p class="mut" style="text-align:center;margin-top:8px">만들려면 로그인이 필요해요</p>':''}`};
V.S05=()=>`${hd('로그인')}<h1>3초 만에 시작해요</h1><p class="mut">로그인하면 식단·루틴 생성, 식단 올리기를 쓸 수 있어요.</p><button class="btn k" data-a="login">카카오로 시작하기</button><button class="btn g" data-a="login">구글로 시작하기</button><button class="btn a" data-a="login">Apple로 시작하기</button>`;
V.S06=()=>S.gen?`<div class="sp"></div><p style="text-align:center"><b>AI가 식단과 루틴을 만들고 있어요</b><br><span class="mut">잠시만 기다려 주세요</span></p>`:`${hd('기간 선택')}<p class="mut">식단과 운동 루틴을 얼마 동안 만들까요?</p>${seg('per',['일주일','한 달'])}<div class="card"><p class="mut">반영되는 정보</p><p style="margin:0">목표 칼로리 ${F(calc().k)} kcal · 현재 강도 ${S.cur} · 원하는 강도 ${S.des} · ${condTxt()}</p></div><button class="btn" data-a="gen">식단·루틴 생성하기</button>`;
V.S07=()=>{const c=calc(),w=wk()[0],n=sn(),g=[['식단 1끼 올리기',P.some(p=>p.d.startsWith('오늘')),''],['오늘 운동 완료',S.wdone,'go|S11'],['이번 주 몸무게 기록',S.wt,'wt|']];return `<h1>안녕하세요, ${S.role=='trainer'?'선생님':'지아님'}</h1><div class="card" data-a="go" data-v="S20"><p class="mut">연속 기록${S.rest?' · 쉬기 모드 중':''}</p><p class="big" style="margin:0">${n}일째</p><p class="mut" style="margin:0">${today()?'오늘 기록 완료!':'오늘 하나만 기록하면 7일이에요'} · 자세히 ›</p></div>${S.role=='member'?`<div class="card" style="border-left:4px solid var(--ac)"><p class="mut" style="margin:0 0 2px">선생님이 준 이번 주 미션</p>${S.mission['김지아']}</div>`:''}<h2 style="margin:6px 0 2px;font-size:18px">오늘의 작은 목표</h2>${g.map(x=>{const a=x[2]?x[2].split('|'):['go','S09'];return `<div class="row" data-a="${a[0]}" data-v="${a[1]}"><span style="display:flex;gap:10px;align-items:center"><span class="ck ${x[1]?'on':''}">${x[1]?'✓':''}</span>${x[0]}</span><span class="mut">${x[1]?'완료':'›'}</span></div>`}).join('')}<div style="height:14px"></div><div class="card"><p class="mut">오늘 먹은 칼로리</p><p style="margin:0"><b style="font-size:22px">1,240</b> / ${F(c.k)} kcal</p><div class="bar"><i style="width:${Math.min(100,1240/c.k*100)}%"></i></div></div><h2 style="margin:16px 0 4px">오늘 식단</h2>${mealC(MEAL[0])}<h2 style="margin:18px 0 8px">오늘 운동</h2><div class="card" data-a="tab" data-v="S11"><b>${w[0]}</b><p class="mut" style="margin:0">${w[1].length}종목 · ${w[1].slice(0,2).map(x=>x[0]).join(', ')} 외</p><div style="display:flex;gap:6px;margin-top:8px">${w[1].map(x=>thumbN(x[0])).join('')}</div></div><p class="mut">AI가 만든 식단과 루틴은 의료 조언이 아닙니다.</p>`};
V.S08=()=>{const m=MEAL[S.day%2];return `<h1>식단</h1>${chips(DAYS,'day')}<p class="mut" style="margin:0 0 10px">g(그램) 수와 칼로리는 AI가 추정한 값이에요. 같은 음식이 없으면 오른쪽 '대체' 음식으로 바꿔 드세요.</p>${mealD(m)}<div class="row"><b>합계</b><b>${F(m.reduce((a,x)=>a+x.k,0))} kcal</b></div><h2 style="margin:18px 0 8px">내가 올린 식단</h2>${P.map((p,i)=>`<div class="card" data-a="openPost" data-v="${i}"><b>${p.d}</b><p class="mut" style="margin:0">${p.n}</p><p style="font-size:13px;margin:6px 0 0">${p.r.slice(0,36)}…</p></div>`).join('')}<button class="btn" data-a="go" data-v="S09">오늘 식단 올리기</button>`};
V.S09=()=>`${hd('식단 올리기')}<div class="pic" data-a="photo">${S.photo?'사진이 선택됐어요':'눌러서 사진 선택'}</div><label class="f">한 줄 설명<input data-in="note" value="${S.note}" placeholder="예: 닭가슴살 150g, 현미밥 1공기"></label><p class="mut">올리면 AI가 확인해서 답변해요 · 이번 달 2 / 5회 사용</p><button class="btn" data-a="post">올리기</button>`;
V.S10=()=>{const p=P[S.post];return `${hd('AI 답변')}<div class="pic">식단 사진</div><p><b>${p.d}</b><br><span class="mut">${p.n}</span></p>${S.wait?'<div class="sp" style="margin:30px auto 10px"></div><p class="mut" style="text-align:center">AI가 식단을 확인하는 중이에요</p>':`<div class="rep">${p.r}</div>`}`};
V.S11=()=>{const w=wk()[S.wd],td=S.wd==0;return `<h1>운동</h1><p class="mut">원하는 강도: ${S.des} · ${condTxt()}</p>${chips(WD,'wd')}<h2 style="margin-bottom:4px">${w[0]}</h2>${w[1].length?w[1].map((x,i)=>{const on=S.chk[S.wd+'-'+i]||(S.wdone&&td);return `<div class="row" data-a="chk" data-v="${i}"><span style="display:flex;gap:10px;align-items:center"><span class="ck ${on?'on':''}">${on?'✓':''}</span>${thumbN(x[0])}<b style="font-weight:500">${x[0]}</b></span><span class="mut">${x[1]}x${x[2]}세트</span></div>`}).join(''):'<div class="card">쉬는 날이에요. 쉬는 날도 기록으로 인정돼요. 가벼운 걷기 30분을 추천해요.</div>'}${td?S.added.map(n=>`<div class="row"><span style="display:flex;gap:10px;align-items:center">${thumbN(n)}<b style="font-weight:500">${n}</b></span><span class="mut">10개x3세트</span></div>`).join(''):''}<button class="btn s" data-a="xopen" data-v="S11">+ 운동 추가</button>${td&&w[1].length?(S.wdone?`<div class="card" data-a="go" data-v="S20" style="margin-top:12px"><b>오늘 운동 완료</b><p class="mut" style="margin:0">연속 ${sn()}일째예요 · 연속 기록 보기 ›</p></div>`:'<button class="btn" data-a="wfin">오늘 운동 완료</button>'):''}${!td&&w[1].length?'<p class="mut" style="margin-top:10px">운동 완료는 오늘(월) 루틴에서만 누를 수 있어요.</p>':''}`};
const streakV=()=>{const n=sn(),b=badges();return `<div class="card"><p class="mut">현재 연속 기록</p><p class="big">${n}일</p><p class="mut" style="margin:0">최장 기록 12일${S.rest?' · 쉬기 모드 중이라 기록이 유지돼요':''}</p><div style="display:flex;gap:6px;margin-top:10px">${[1,2,3,4,5,6,7].map(i=>`<span class="dot ${i<7||today()?'on':''}">${i<7||today()?'✓':''}</span>`).join('')}</div><p class="mut" style="margin:8px 0 0">최근 7일 (마지막이 오늘)</p></div><div class="row"><span>쉬기 모드<br><span class="mut">아프거나 다칠 때 켜 두세요 (최대 7일)</span></span><button class="tg ${S.rest?'on':''}" data-a="rest" aria-label="쉬기 모드"></button></div><div class="row"><span>스트릭 프리즈<br><span class="mut">하루 놓쳐도 기록을 지켜 줘요 · 이번 달 ${S.fz}회 남음</span></span><button class="chip" data-a="fz">사용하기</button></div><h2 style="margin:18px 0 8px;font-size:18px">배지</h2><div class="g2">${b.map(x=>`<div class="card" style="opacity:${x[1]?1:.55};margin:0"><b>${x[0]}</b><p class="mut" style="margin:4px 0 0">${x[1]?'획득했어요':x[2]}</p></div>`).join('')}</div>`};
const MD={done:[1,2,3,5,6,8,9],rest:[4,7,10,11]};
const statsV=()=>{const wd=S.wdone?1:0,cells=['','',''].concat(Array.from({length:31},(_,i)=>i+1));return `<div class="card"><p class="mut">이번 달 운동 달력 (10월)</p><div class="cal">${'월화수목금토일'.split('').map(d=>`<span class="mut" style="font-size:12px">${d}</span>`).join('')}${cells.map(d=>{if(!d)return '<span></span>';const dn=MD.done.includes(d)||(d==12&&S.wdone),rs=MD.rest.includes(d);return `<span class="cd ${dn?'on':rs?'rs':d>12?'fu':''} ${d==12?'td':''}">${d}</span>`}).join('')}</div><p class="mut" style="margin:10px 0 0">진한 색 = 운동한 날 · 연한 색 = 쉬는 날(기록으로 인정)</p></div><div class="card"><p class="mut">이번 주 운동 완료율</p><p style="margin:0"><b style="font-size:22px">${wd}</b> / 4일 완료</p><div class="bar"><i style="width:${wd/4*100}%"></i></div><p class="mut" style="margin:0">이번 주 루틴 4일 기준이에요. 휴식일과 쉬기 모드 기간은 빼고 계산해요.</p></div><p class="mut">통계는 나에게만 보여요. 기록이 쌓이면 체중 그래프, 종목별 기록 추이도 보여드릴게요.</p>`};
V.S20=()=>`${hd('내 기록')}${seg('t20',['연속 기록','통계'])}${S.t20=='통계'?statsV():streakV()}`;
V.S12=()=>`<h1>운동일지</h1><p class="mut">PT 회원님 전용 기능이에요. 선생님이 수업마다 작성한 일지를 여기서 받아볼 수 있어요.</p><div class="ghost"><div class="card"><b>10월 6일 · 하체</b><p style="margin:0">바벨 스쿼트 60kg 4×8<br>레그 프레스 100kg 3×12</p></div><div class="card"><b>10월 3일 · 가슴 · 삼두</b><p style="margin:0">벤치프레스 45kg 4×8</p></div></div><button class="btn" data-a="toast" data-v="선생님께 PT 문의가 전달돼요 (데모)">PT 문의하기</button><button class="btn s" data-a="go" data-v="S16">PT 코드가 있어요</button>`;
V.S13=()=>`<h1>운동일지</h1><p class="mut">담당 선생님이 작성한 내 일지예요. 나만 볼 수 있어요.</p>${L.map((x,i)=>`<div class="card" data-a="openLog" data-v="${i}"><b>${x.d} · ${x.t}</b><p class="mut" style="margin:0">${x.i.length}종목${x.v.length?' · 영상 '+x.v.length+'개':''} · ${x.c.slice(0,22)}…</p></div>`).join('')}`;
V.S14=()=>{const x=L[S.log];return `${hd(x.d+' · '+x.t)}${x.i.map(i=>`<div class="row"><span style="display:flex;gap:10px;align-items:center">${thumbN(i[0])}<b style="font-weight:500">${i[0]}</b></span><span class="mut">${i[1]}, ${i[2]}x${i[3]}세트</span></div>`).join('')}${x.v.length?`<h2 style="margin:16px 0 0;font-size:16px">운동 영상</h2>${x.v.map((n,j)=>`<div class="vid" data-a="toast" data-v="영상 재생 (데모)"><span>${n}</span></div><div class="row" style="border:0;padding:6px 0"><span class="mut">서버 보관 만료까지 ${x.ex}일</span>${S.sv[S.log+'-'+j]?'<span class="mut">내 폰에 저장됨</span>':`<button class="chip" data-a="psave" data-v="${S.log}-${j}">내 폰에 저장</button>`}</div>`).join('')}`:''}<div class="rep"><p class="mut" style="margin:0 0 4px">선생님 코멘트</p>${x.c}<p style="margin:8px 0 0"><span class="chip on" style="display:inline-block;padding:4px 10px">${x.st}</span></p></div>`};
V.S15=()=>{const r=S.role;return `<h1>내 정보</h1><p class="mut">${r=='trainer'?'선생님 계정':r=='member'?'PT 회원 · 담당 선생님 연결됨':'일반 회원'}</p><div class="card"><div class="row" style="border:0;padding:0"><b>이번 달 AI 사용</b><span class="mut">2 / 5회</span></div><div class="bar"><i style="width:40%"></i></div><button class="btn s" style="margin-top:4px" data-a="go" data-v="S17">더 많이 쓰기</button></div><div class="row" data-a="go" data-v="S02"><span>몸 정보 수정</span><span class="mut">›</span></div><div class="row" data-a="go" data-v="S03"><span>운동 장소·장비 수정<br><span class="mut">${condTxt()}</span></span><span class="mut">›</span></div><div class="row"><span>매일 알림<br><span class="mut">식단·운동 확인 리마인더</span></span><button class="tg ${S.push?'on':''}" data-a="push" aria-label="알림"></button></div><div class="row"><span>알림 시간</span><input type="time" class="in" style="width:120px;margin:0" data-in="time" value="${S.time}"></div><div class="row"><span>쉬기 모드<br><span class="mut">아프거나 다칠 때 켜면 연속 기록이 유지돼요</span></span><button class="tg ${S.rest?'on':''}" data-a="rest" aria-label="쉬기 모드"></button></div><div class="row" data-a="go" data-v="S20"><span>연속 기록 · 배지</span><span class="mut">${sn()}일 ›</span></div>${r=='user'?'<div class="row" data-a="go" data-v="S16"><span>PT 코드 입력</span><span class="mut">›</span></div>':''}${r=='trainer'?'<div class="row" data-a="tab" data-v="S18"><span>회원 관리</span><span class="mut">›</span></div>':''}<div class="row" data-a="go" data-v="S17"><span>구독</span><span class="mut">›</span></div><div class="row" data-a="role" data-v="guest"><span>로그아웃</span></div><div class="row" data-a="toast" data-v="계정 삭제 확인 화면이 열려요 (데모)"><span style="color:var(--bad)">계정 삭제</span></div>`};
